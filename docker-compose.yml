services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adv_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adv_rag

      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-documents}

      UPSTASH_REDIS_URL: ${UPSTASH_REDIS_URL}
      UPSTASH_REDIS_TOKEN: ${UPSTASH_REDIS_TOKEN}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}

      LOG_JSON: ${LOG_JSON:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      REFLECTION_MIN_SCORE: ${REFLECTION_MIN_SCORE:-0.85}
      MAX_REFLECTION_RETRIES: ${MAX_REFLECTION_RETRIES:-2}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./seed:/app/seed

    command: ["python", "scripts/serve.py"]

volumes:
  postgres_data: